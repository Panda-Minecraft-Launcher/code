name: Panda Minecraft Launcher build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sign-macos-binaries:
        description: Sign macOS binaries
        type: boolean
        default: true
        required: false
      sign-windows-binaries:
        description: Sign Windows binaries
        type: boolean
        default: false
        required: false
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
          - prod-with-staging-archon
        default: prod
        required: false
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  pnpm_config_color: always

jobs:
  build:
    name: Build (${{ matrix.artifact-target-name }})
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            artifact-target-name: x86_64-unknown-linux-gnu
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ''
          build-warnings: ''
          target: ${{ matrix.rust-target }}
          cache: false

      - name: Setup mold
        if: contains(matrix.artifact-target-name, 'linux')
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1 / Mold 3.0.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Remove bundles restored from cache
        shell: bash
        run: rm -rf target/*/bundle target/*/*/bundle

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Panda Minecraft Launcher (dev-${GIT_HASH})",
            "mainBinaryName": "Panda Minecraft Launcher (dev-${GIT_HASH})",
            "identifier": "PandaMinecraftLauncher-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install Linux build dependencies
        if: contains(matrix.artifact-target-name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ contains(matrix.artifact-target-name, 'windows') && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(git describe --tags --always | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
          fi
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env
          dasel delete -f apps/app/tauri-release.conf.json 'bundle.createUpdaterArtifacts'
          dasel delete -f apps/app/tauri-release.conf.json 'bundle.windows.signCommand'

      - name: Install dependencies
        run: pnpm install

      - name: Build Linux app
        run: pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --bundles "appimage"
        if: contains(matrix.artifact-target-name, 'linux')

      - name: Build Windows app
        run: |
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "nsis"
        if: contains(matrix.artifact-target-name, 'windows')

      - name: Upload app bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          path: |
            target/release/bundle/appimage/Panda Minecraft Launcher_*.AppImage*
            target/release/bundle/nsis/Panda Minecraft Launcher_*-setup.exe*

      - name: Remove bundles from cached target directory
        if: always()
        shell: bash
        run: rm -rf target/*/bundle target/*/*/bundle

  notify:
    name: Notify Slack
    needs: build
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Send Slack notification
        run: node .github/scripts/notify-app-build.mjs
        env:
          BUILD_ENVIRONMENT: ${{ inputs.environment || 'prod' }}
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_APP_BUILDS_WEBHOOK_URL }}

  trigger-release:
    name: Trigger release
    needs: build
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Panda Minecraft Launcher release" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            -f version_tag="${{ github.ref_name }}" \
            -f build_run_id="${{ github.run_id }}"
